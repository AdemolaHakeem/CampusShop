# ============================================================
# CampusShop — Supabase Keep-Alive Workflow
# ============================================================
# Supabase free-tier projects are paused after 7 days of
# low database activity. This workflow runs every 6 hours
# and performs a lightweight database query to appear
# "active" to Supabase's auto-pause system.
#
# Supabase docs: "A few user requests to the database each
# day over the previous week is enough to keep the project
# from being paused."
# ============================================================

name: Keep Supabase Alive

on:
  # Run every 6 hours — well within the 7-day inactivity window
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Check secrets are configured
        id: check-secrets
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Support both naming conventions (SUPABASE_* or VITE_SUPABASE_*)
          if [ -z "$URL" ] && [ -n "$VITE_URL" ]; then
            URL="$VITE_URL"
          fi

          if [ -z "$KEY" ] && [ -n "$VITE_KEY" ]; then
            KEY="$VITE_KEY"
          fi

          if [ -z "$URL" ]; then
            echo "❌ URL secret is not set!"
            echo ""
            echo "   Go to your repo → Settings → Secrets and variables → Actions"
            echo "   Add a secret named either:"
            echo "     SUPABASE_URL     (recommended)"
            echo "     VITE_SUPABASE_URL (your app's env var name)"
            echo ""
            echo "   Value: https://xxxxxxxxxxxx.supabase.co"
            exit 1
          fi

          if [ -z "$KEY" ]; then
            echo "❌ API key secret is not set!"
            echo ""
            echo "   Go to your repo → Settings → Secrets and variables → Actions"
            echo "   Add a secret named either:"
            echo "     SUPABASE_ANON_KEY      (recommended)"
            echo "     VITE_SUPABASE_ANON_KEY (your app's env var name)"
            echo ""
            echo "   Value: your anon public key"
            exit 1
          fi

          # Validate URL format
          if [[ ! "$URL" =~ ^https?://[^/]+$ ]]; then
            echo "❌ SUPABASE_URL looks wrong: '$URL'"
            echo ""
            echo "   It should be just the base URL, like:"
            echo "   https://xxxxxxxxxxxx.supabase.co"
            echo ""
            echo "   No trailing slashes, no paths like /rest/v1/"
            exit 1
          fi

          # Save to env for next step
          echo "supabase_url=$URL" >> $GITHUB_OUTPUT
          echo "supabase_key=$KEY" >> $GITHUB_OUTPUT
          echo "✅ Secrets found and valid!"

      - name: 📡 Ping listings table
        env:
          SUPABASE_URL: ${{ steps.check-secrets.outputs.supabase_url }}
          SUPABASE_ANON_KEY: ${{ steps.check-secrets.outputs.supabase_key }}
        run: |
          echo "🔄 Pinging: ${SUPABASE_URL}/rest/v1/listings"
          echo ""

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/listings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --connect-timeout 15 \
            --max-time 30)

          echo "   Response: HTTP ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo ""
            echo "✅ Supabase is active! Project will not be paused."
          elif [ "$HTTP_STATUS" = "540" ]; then
            echo ""
            echo "⚠️  Project is PAUSED (HTTP 540)."
            echo "   Go to https://supabase.com/dashboard to resume it manually."
            echo "   After resuming, this workflow will keep it alive."
          else
            echo ""
            echo "⚠️  Unexpected response: HTTP ${HTTP_STATUS}"
            echo "   (This is normal if the project hasn't been set up yet.)"
          fi

      - name: ✅ Done
        run: |
          echo ""
          echo "============================================"
          echo "  Ping completed at $(date)"
          echo "  Next run: 6 hours from now"
          echo "============================================"
