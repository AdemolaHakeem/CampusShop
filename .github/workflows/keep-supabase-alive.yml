# ============================================================
# CampusShop — Supabase Keep-Alive Workflow
# ============================================================
# Supabase free-tier projects are paused after 7 days of
# low database activity. This workflow runs every 6 hours
# and performs a lightweight database query to appear
# "active" to Supabase's auto-pause system.
#
# Supabase docs: "A few user requests to the database each
# day over the previous week is enough to keep the project
# from being paused."
# ============================================================

name: Keep Supabase Alive

on:
  # Run every 6 hours — well within the 7-day inactivity window
  schedule:
    - cron: '0 */6 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Query listings table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🔄 Pinging Supabase to prevent auto-pause..."
          echo "   URL: ${SUPABASE_URL}"

          # A simple SELECT id LIMIT 1 generates real database activity
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/listings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --connect-timeout 15 \
            --max-time 30)

          echo "   HTTP status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Supabase is active! Project will not be paused."
          elif [ "$HTTP_STATUS" = "540" ]; then
            echo "⚠️  Project is PAUSED (HTTP 540)."
            echo "   Go to https://supabase.com/dashboard to resume it manually,"
            echo "   then this workflow will keep it alive going forward."
          else
            echo "⚠️  Unexpected status: HTTP ${HTTP_STATUS}"
          fi

      - name: Done
        run: |
          echo ""
          echo "============================================"
          echo "  ✅ Ping completed at $(date)"
          echo "  ✅ Next run: 6 hours from now"
          echo "============================================"
